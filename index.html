
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mateo Laurent | Currículum Ejecutivo</title>
    <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="navbar">
        <div class="logo">ML.</div>
        <nav class="nav-links">
            <a href="#perfil">Perfil</a>
            <a href="#trayectoria">Trayectoria</a>
            <a href="#competencias">Competencias</a>
            <a href="#obras">Obras</a>
        </nav>
        <a href="#contacto" class="nav-contact">Contacto</a>
    </header>

    <section class="editorial-hero" id="inicio">
        <div class="hero-content">
            <div class="content-wrapper">
                <span class="hero-tag reveal-text">Arquitecto Principal & Director Creativo</span>
                <h1 class="hero-title reveal-text">Mateo<br>Laurent</h1>
                <p class="hero-desc reveal-text">
                    Diseño atemporal que redefine el entorno y eleva la experiencia humana. Arquitectura concebida con propósito, rigor y una visión global.
                </p>
                <div class="hero-action reveal-text">
                    <a href="#perfil" class="btn-editorial">Conocer más <span>&darr;</span></a>
                </div>
            </div>
        </div>

        <div class="hero-visual" id="parallax-container">
            <div class="image-wrapper" id="parallax-image">
                
                <img src="https://images.unsplash.com/photo-1600585154340-be6161a56a0c?ixlib=rb-4.0.3&auto=format&fit=crop&w=800&q=80" alt="Fotografía Editorial Mateo Laurent">
                
            </div>
        </div>

    <script src="app.js"></script>
